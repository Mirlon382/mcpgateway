[project]
name = "mcpgateway"
version = "0.1.0"
description = "Passerelle MCP du Service Statistique Public : agrège et expose les serveurs MCP de l'Insee"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.4",
    "pydantic>=2.12",
    "pyyaml>=6.0.2",
]

[project.scripts]
mcpgateway = "mcpgateway.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: binds local ports and starts subprocesses (run with -m integration)",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
